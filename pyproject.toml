[project]
name = "vast-troubleshooter"
version = "0.1.0"
description = "A local, offline command-line tool that diagnoses (and, with consent, fixes) problems on Vast.ai Linux GPU hosts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "vralhanai", email = "vralhan.ai@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "pydantic>=2.14.4",
    "rich>=15.0.0",
    "typer>=0.29.2",
]

[project.scripts]
vast-troubleshooter = "vast_troubleshooter.cli:app"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
