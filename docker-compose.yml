# Dev and test only. Run the Linux tool on a Windows machine, hardened.
#
#   docker compose run --rm vast-troubleshooter diagnose
#   docker compose run --rm vast-troubleshooter report --output-dir /reports
#   docker compose run --rm tests
#
# What this file deliberately does NOT do (a test enforces each of these):
#   no Docker socket, no host folder mounts, no --privileged, no added
#   capabilities, no host PID / network / IPC namespace, no root user.
name: vast-troubleshooter-dev

services:
  vast-troubleshooter:
    build:
      context: .
      target: runtime
    image: vast-troubleshooter:dev
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /home/vast:rw,noexec,nosuid,uid=10001,gid=10001,size=16m
    volumes:
      # A named volume, not a host folder: reports stay private to the container user.
      - reports:/reports

  tests:
    build:
      context: .
      target: test
    image: vast-troubleshooter:test
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 1g
    tmpfs:
      - /tmp:rw,nosuid,size=256m

volumes:
  reports: {}
